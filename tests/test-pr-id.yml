name: Test pr_id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML report
        run: |
          mkdir -p /tmp/junit-reports
          cat > /tmp/junit-reports/TEST-prid.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="PrIdSuite" tests="2" failures="0" errors="0" skipped="0" time="0.4">
            <testcase name="testFoo" classname="com.example.PrIdSuite" time="0.2"/>
            <testcase name="testBar" classname="com.example.PrIdSuite" time="0.2"/>
          </testsuite>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          report_paths: '/tmp/junit-reports/TEST-prid.xml'
          pr_id: '1'
          annotate_only: 'true'
          fail_on_failure: 'false'
          comment: 'false'

      - name: Assert action ran and produced outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total }}
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total: $TOTAL"
          echo "passed: $PASSED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL" ]; then
              echo "FAIL: action succeeded but total output is empty"
              exit 1
            fi
            if [ "$TOTAL" != "2" ]; then
              echo "FAIL: expected total=2, got '$TOTAL'"
              exit 1
            fi
            echo "PASS: total=$TOTAL passed=$PASSED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
