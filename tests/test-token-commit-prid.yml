name: Test github_token, commit and pr_id inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get HEAD sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          report_paths: 'tests/fixtures/mixed/*.xml'
          annotate_only: 'true'
          github_token: ${{ github.token }}
          commit: ${{ steps.sha.outputs.sha }}
          pr_id: '1'
          comment: 'false'
      - name: Assert counts
        env:
          TOTAL: ${{ steps.action.outputs.total }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome=$OUTCOME total=$TOTAL passed=$PASSED failed=$FAILED"
          [ "$OUTCOME" = "success" ] || { echo "FAIL: outcome expected success"; exit 1; }
          [ "$TOTAL" = "4" ] || { echo "FAIL: total expected 4"; exit 1; }
          [ "$PASSED" = "2" ] || { echo "FAIL: passed expected 2"; exit 1; }
          [ "$FAILED" = "1" ] || { echo "FAIL: failed expected 1"; exit 1; }
          echo "PASS"
