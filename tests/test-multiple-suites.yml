name: Test multiple JUnit report files grouped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report_paths: '${{ github.workspace }}/tests/fixtures/junit-multiple/TEST-*.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
          group_reports: 'true'
          check_name: 'Multiple Suites Report'
          job_summary: 'false'
          detailed_summary: 'true'
          group_suite: 'true'
          skip_annotations: 'true'

      - name: Assert total count aggregated from both suites
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "5" ]; then
            echo "FAIL: expected total=5 (3+2), got '$TOTAL'"
            exit 1
          fi
          echo "PASS: total=5"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "4" ]; then
            echo "FAIL: expected passed=4 (3+1), got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed=4"

      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "1" ]; then
            echo "FAIL: expected failed=1, got '$FAILED'"
            exit 1
          fi
          echo "PASS: failed=1"

      - name: Assert summary is non-empty
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary: $SUMMARY"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected non-empty summary"
            exit 1
          fi
          echo "PASS: summary is non-empty"
