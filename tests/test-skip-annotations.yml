name: Test skip annotations and annotations limit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report_paths: '${{ github.workspace }}/hardened/tests/fixtures/junit-reports/TEST-basic.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
          check_name: 'Skip Annotations Test Report'
          job_summary: 'true'
          skip_annotations: 'true'
          annotations_limit: '10'
          exclude_sources: 'src/generated,build/generated'

      - name: Assert total count
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "3" ]; then
            echo "FAIL: expected total=3, got '$TOTAL'"
            exit 1
          fi
          echo "PASS: total=$TOTAL"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected passed=3, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed=$PASSED"

      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected failed=0, got '$FAILED'"
            exit 1
          fi
          echo "PASS: failed=$FAILED"
