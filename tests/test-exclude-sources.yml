name: Test exclude sources and github_token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create passing JUnit XML report
        run: |
          mkdir -p /tmp/junit-reports
          cat > /tmp/junit-reports/TEST-exclude.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="ExcludeSuite" tests="2" failures="0" errors="0" skipped="0" time="0.800">
            <testcase name="testOne" classname="com.example.ExcludeTest" time="0.400"/>
            <testcase name="testTwo" classname="com.example.ExcludeTest" time="0.400"/>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          report_paths: '/tmp/junit-reports/TEST-exclude.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
          check_name: 'Exclude Sources Test Report'
          job_summary: 'true'
          github_token: ${{ github.token }}
          exclude_sources: 'src/generated,build/generated'

      - name: Assert total count
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "2" ]; then
            echo "FAIL: expected total=2, got '$TOTAL'"
            exit 1
          fi
          echo "PASS: total=2"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "2" ]; then
            echo "FAIL: expected passed=2, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed=2"

      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected failed=0, got '$FAILED'"
            exit 1
          fi
          echo "PASS: failed=0"
