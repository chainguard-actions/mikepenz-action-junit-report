name: Test deprecated github_token with explicit commit and pr_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve HEAD sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          report_paths: 'tests/fixtures/passing/TEST-*.xml'
          github_token: ${{ github.token }}
          commit: ${{ steps.sha.outputs.sha }}
          pr_id: '1'
          comment: 'false'
      - name: Assert outputs set
        env:
          TOTAL: ${{ steps.action.outputs.total }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "total=$TOTAL passed=$PASSED failed=$FAILED"
          [ "$TOTAL" = "3" ] || { echo "FAIL: total expected 3"; exit 1; }
          [ "$PASSED" = "3" ] || { echo "FAIL: passed expected 3"; exit 1; }
          [ "$FAILED" = "0" ] || { echo "FAIL: failed expected 0"; exit 1; }
          [ -n "$SUMMARY" ] || { echo "FAIL: summary empty"; exit 1; }
          echo "PASS"
