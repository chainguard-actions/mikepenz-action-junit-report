name: Test custom check name and title template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML report
        run: |
          mkdir -p /tmp/junit-reports
          cat > /tmp/junit-reports/TEST-custom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="CustomSuite" tests="2" failures="0" errors="0" skipped="0" time="0.600">
            <testcase name="testAlpha" classname="com.example.CustomClass" time="0.300"/>
            <testcase name="testBeta" classname="com.example.CustomClass" time="0.300"/>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          report_paths: '/tmp/junit-reports/TEST-*.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
          check_name: 'My Custom Check Name'
          check_title_template: '{{SUITE_NAME}} / {{TEST_NAME}}'
          job_summary: 'true'
          summary: 'Custom summary text appended'

      - name: Assert total count
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "2" ]; then
            echo "FAIL: expected total=2, got '$TOTAL'"
            exit 1
          fi
          echo "PASS: total=2"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "2" ]; then
            echo "FAIL: expected passed=2, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed=2"

      - name: Assert summary output is non-empty
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary: $SUMMARY"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected non-empty summary"
            exit 1
          fi
          echo "PASS: summary is non-empty"
