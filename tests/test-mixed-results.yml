name: Test mixed results without failing build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          report_paths: 'tests/fixtures/mixed/*.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
      - name: Assert counts
        env:
          TOTAL: ${{ steps.action.outputs.total }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome=$OUTCOME total=$TOTAL passed=$PASSED failed=$FAILED skipped=$SKIPPED"
          [ "$OUTCOME" = "success" ] || { echo "FAIL: outcome expected success"; exit 1; }
          [ "$TOTAL" = "4" ] || { echo "FAIL: total expected 4"; exit 1; }
          [ "$PASSED" = "2" ] || { echo "FAIL: passed expected 2"; exit 1; }
          [ "$FAILED" = "1" ] || { echo "FAIL: failed expected 1"; exit 1; }
          [ "$SKIPPED" = "1" ] || { echo "FAIL: skipped expected 1"; exit 1; }
          echo "PASS"
