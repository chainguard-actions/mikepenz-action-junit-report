name: Test detailed summary output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report_paths: '${{ github.workspace }}/tests/fixtures/junit-detailed/TEST-*.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
          check_name: 'Detailed Summary Report'
          job_summary: 'false'
          detailed_summary: 'true'
          include_passed: 'true'
          include_skipped: 'true'
          skip_annotations: 'true'

      - name: Assert total count
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "5" ]; then
            echo "FAIL: expected total=5, got '$TOTAL'"
            exit 1
          fi
          echo "PASS: total=5"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "2" ]; then
            echo "FAIL: expected passed=2, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed=2"

      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "1" ]; then
            echo "FAIL: expected failed=1, got '$FAILED'"
            exit 1
          fi
          echo "PASS: failed=1"

      - name: Assert skipped count
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "2" ]; then
            echo "FAIL: expected skipped=2, got '$SKIPPED'"
            exit 1
          fi
          echo "PASS: skipped=2"

      - name: Assert detailed_summary is non-empty
        env:
          DETAILED: ${{ steps.action.outputs.detailed_summary }}
        run: |
          echo "detailed_summary length: ${#DETAILED}"
          if [ -z "$DETAILED" ]; then
            echo "FAIL: expected non-empty detailed_summary"
            exit 1
          fi
          echo "PASS: detailed_summary is non-empty"

      - name: Assert time output is non-empty
        env:
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: expected non-empty time output"
            exit 1
          fi
          echo "PASS: time output is non-empty"
