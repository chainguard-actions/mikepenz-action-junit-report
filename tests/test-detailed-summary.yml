name: Test detailed summary output with multiple suites
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report_paths: '${{ github.workspace }}/tests/fixtures/junit-reports/TEST-suite*.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
          detailed_summary: 'true'
          include_passed: 'true'
          job_summary: 'true'
          check_name: 'Detailed Summary Report'

      - name: Assert total count across both suites
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "4" ]; then
            echo "FAIL: expected total=4, got '$TOTAL'"
            exit 1
          fi
          echo "PASS: total=$TOTAL"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected passed=3, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed=$PASSED"

      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "1" ]; then
            echo "FAIL: expected failed=1, got '$FAILED'"
            exit 1
          fi
          echo "PASS: failed=$FAILED"

      - name: Assert detailed_summary is non-empty
        env:
          DETAILED: ${{ steps.action.outputs.detailed_summary }}
        run: |
          echo "detailed_summary length: ${#DETAILED}"
          if [ -z "$DETAILED" ]; then
            echo "FAIL: expected non-empty detailed_summary"
            exit 1
          fi
          echo "PASS: detailed_summary is non-empty"

      - name: Assert time output is non-empty
        env:
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: expected non-empty time output"
            exit 1
          fi
          echo "PASS: time=$TIME"
