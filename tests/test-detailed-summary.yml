name: Test detailed summary with passed tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          report_paths: 'tests/fixtures/mixed/TEST-*.xml'
          annotate_only: 'true'
          detailed_summary: 'true'
          include_passed: 'true'
      - name: Assert detailed summary lists test cases
        env:
          DETAILED: ${{ steps.action.outputs.detailed_summary }}
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total=$TOTAL"
          echo "detailed: $DETAILED"
          [ "$TOTAL" = "4" ] || { echo "FAIL: total expected 4"; exit 1; }
          for name in testPassOne testBroken; do
            if ! echo "$DETAILED" | grep -q "$name"; then
              echo "FAIL: detailed summary missing $name"
              exit 1
            fi
          done
          echo "PASS"
