name: Test detailed summary output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML report with mixed results
        run: |
          mkdir -p /tmp/junit-reports
          cat > /tmp/junit-reports/TEST-mixed.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="MixedSuite" tests="3" failures="1" errors="0" skipped="1" time="1.500">
            <testcase name="testPass" classname="com.example.MixedClass" time="0.500"/>
            <testcase name="testFail" classname="com.example.MixedClass" time="0.600">
              <failure message="Assertion failed" type="AssertionError">
                Expected value to be true
                at com.example.MixedClass.testFail(MixedClass.java:30)
              </failure>
            </testcase>
            <testcase name="testSkip" classname="com.example.MixedClass" time="0.000">
              <skipped message="Not implemented yet"/>
            </testcase>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          report_paths: '/tmp/junit-reports/TEST-*.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
          detailed_summary: 'true'
          include_passed: 'true'
          include_skipped: 'true'
          check_name: 'Detailed Summary Test Report'
          job_summary: 'true'

      - name: Assert total count
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "3" ]; then
            echo "FAIL: expected total=3, got '$TOTAL'"
            exit 1
          fi
          echo "PASS: total=3"

      - name: Assert detailed_summary is non-empty
        env:
          DETAILED: ${{ steps.action.outputs.detailed_summary }}
        run: |
          echo "detailed_summary length: ${#DETAILED}"
          if [ -z "$DETAILED" ]; then
            echo "FAIL: expected non-empty detailed_summary output"
            exit 1
          fi
          echo "PASS: detailed_summary is non-empty"

      - name: Assert summary is non-empty
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary: $SUMMARY"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected non-empty summary output"
            exit 1
          fi
          echo "PASS: summary is non-empty"
