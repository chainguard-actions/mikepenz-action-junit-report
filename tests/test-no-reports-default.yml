name: Test no reports found without require_tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          report_paths: 'tests/fixtures/does-not-exist/TEST-*.xml'
          annotate_only: 'true'
      - name: Assert zero counts
        env:
          TOTAL: ${{ steps.action.outputs.total }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "total=$TOTAL passed=$PASSED failed=$FAILED"
          [ "$TOTAL" = "0" ] || { echo "FAIL: total expected 0"; exit 1; }
          [ "$PASSED" = "0" ] || { echo "FAIL: passed expected 0"; exit 1; }
          [ "$FAILED" = "0" ] || { echo "FAIL: failed expected 0"; exit 1; }
          echo "PASS"
