name: Test require_tests flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-no-tests
        uses: .
        continue-on-error: true
        with:
          report_paths: '/tmp/nonexistent-reports/TEST-*.xml'
          annotate_only: 'true'
          require_tests: 'true'
          fail_on_failure: 'false'
          check_name: 'Require Tests Report'
          job_summary: 'false'

      - name: Assert action failed when no tests found and require_tests=true
        env:
          OUTCOME: ${{ steps.action-no-tests.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require_tests=true and no tests found, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when require_tests=true and no tests found"
