name: Test require_tests fails when no tests found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          report_paths: '**/nonexistent-reports/TEST-*.xml'
          require_tests: 'true'
          annotate_only: 'true'

      - name: Assert action failed because no tests were found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed because require_tests=true and no test files found"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed because require_tests=true and no test files exist"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
