name: Test annotations control inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create passing JUnit XML report
        run: |
          mkdir -p /tmp/junit-reports
          cat > /tmp/junit-reports/TEST-annotations.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="AnnotationsSuite" tests="5" failures="0" errors="0" skipped="0" time="2.000">
            <testcase name="testAlpha" classname="com.example.AnnotationsTest" time="0.400"/>
            <testcase name="testBeta" classname="com.example.AnnotationsTest" time="0.400"/>
            <testcase name="testGamma" classname="com.example.AnnotationsTest" time="0.400"/>
            <testcase name="testDelta" classname="com.example.AnnotationsTest" time="0.400"/>
            <testcase name="testEpsilon" classname="com.example.AnnotationsTest" time="0.400"/>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          report_paths: '/tmp/junit-reports/TEST-annotations.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
          check_name: 'Annotations Control Test Report'
          job_summary: 'true'
          annotations_limit: '10'
          skip_annotations: 'true'

      - name: Assert total count
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "5" ]; then
            echo "FAIL: expected total=5, got '$TOTAL'"
            exit 1
          fi
          echo "PASS: total=5"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "5" ]; then
            echo "FAIL: expected passed=5, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed=5"

      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected failed=0, got '$FAILED'"
            exit 1
          fi
          echo "PASS: failed=0"
