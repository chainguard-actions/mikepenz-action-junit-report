name: Test multiple JUnit report files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple JUnit XML report files
        run: |
          mkdir -p /tmp/junit-multi
          cat > /tmp/junit-multi/TEST-suite1.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Suite1" tests="2" failures="0" errors="0" skipped="0" time="0.300">
            <testcase name="test1" classname="com.example.Suite1Test" time="0.100"/>
            <testcase name="test2" classname="com.example.Suite1Test" time="0.200"/>
          </testsuite>
          EOF

          cat > /tmp/junit-multi/TEST-suite2.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Suite2" tests="3" failures="1" errors="0" skipped="1" time="0.600">
            <testcase name="test3" classname="com.example.Suite2Test" time="0.100"/>
            <testcase name="test4" classname="com.example.Suite2Test" time="0.200">
              <failure message="AssertionError" type="AssertionError">Test failed</failure>
            </testcase>
            <testcase name="test5" classname="com.example.Suite2Test" time="0.000">
              <skipped/>
            </testcase>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          report_paths: '/tmp/junit-multi/TEST-*.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
          group_reports: 'true'
          check_name: 'Multiple Reports Test'

      - name: Assert total count across all reports
        env:
          ACTUAL: ${{ steps.action.outputs.total }}
        run: |
          echo "actual total: $ACTUAL"
          if [ "$ACTUAL" != "5" ]; then
            echo "FAIL: expected total=5, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: total=5"

      - name: Assert passed count across all reports
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "3" ]; then
            echo "FAIL: expected passed=3, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: passed=3"

      - name: Assert failed count across all reports
        env:
          ACTUAL: ${{ steps.action.outputs.failed }}
        run: |
          echo "actual failed: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected failed=1, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: failed=1"

      - name: Assert skipped count across all reports
        env:
          ACTUAL: ${{ steps.action.outputs.skipped }}
        run: |
          echo "actual skipped: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected skipped=1, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: skipped=1"
