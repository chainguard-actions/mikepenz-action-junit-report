name: Test multiple JUnit report files grouped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple JUnit XML reports
        run: |
          mkdir -p "$GITHUB_WORKSPACE/junit-reports"

          cat > "$GITHUB_WORKSPACE/junit-reports/TEST-suite1.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Suite1" tests="2" failures="0" errors="0" skipped="0" time="1.000">
            <testcase name="test1" classname="com.example.Suite1" time="0.500"/>
            <testcase name="test2" classname="com.example.Suite1" time="0.500"/>
          </testsuite>
          EOF

          cat > "$GITHUB_WORKSPACE/junit-reports/TEST-suite2.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Suite2" tests="3" failures="0" errors="0" skipped="1" time="2.000">
            <testcase name="test1" classname="com.example.Suite2" time="0.500"/>
            <testcase name="test2" classname="com.example.Suite2" time="0.500"/>
            <testcase name="test3" classname="com.example.Suite2" time="1.000">
              <skipped/>
            </testcase>
          </testsuite>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          report_paths: '**/junit-reports/TEST-*.xml'
          group_reports: 'true'
          fail_on_failure: 'false'
          annotate_only: 'true'

      - name: Assert combined totals from multiple reports
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total }}
          PASSED: ${{ steps.action.outputs.passed }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total: $TOTAL"
          echo "passed: $PASSED"
          echo "skipped: $SKIPPED"
          echo "failed: $FAILED"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL" ]; then
              echo "FAIL: action succeeded but total output is empty"
              exit 1
            fi
            if [ "$TOTAL" != "5" ]; then
              echo "FAIL: expected total=5 (2+3), got '$TOTAL'"
              exit 1
            fi
            if [ "$PASSED" != "4" ]; then
              echo "FAIL: expected passed=4, got '$PASSED'"
              exit 1
            fi
            if [ "$SKIPPED" != "1" ]; then
              echo "FAIL: expected skipped=1, got '$SKIPPED'"
              exit 1
            fi
            if [ "$FAILED" != "0" ]; then
              echo "FAIL: expected failed=0, got '$FAILED'"
              exit 1
            fi
            echo "PASS: combined totals correct"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
