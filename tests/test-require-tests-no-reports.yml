name: Test require_tests fails when no reports found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: junit
        uses: .
        with:
          report_paths: '/tmp/nonexistent-reports/TEST-*.xml'
          check_name: 'Require Tests Report'
          require_tests: 'true'
          fail_on_failure: 'false'
          annotate_only: 'true'
          job_summary: 'false'
        continue-on-error: true

      - name: Assert step failed because no tests were found
        env:
          OUTCOME: ${{ steps.junit.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step outcome=failure when require_tests=true and no reports found, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: step correctly failed because no tests were found"
