name: Test commit input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML report
        run: |
          mkdir -p junit-reports
          cat > junit-reports/TEST-commit.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="CommitSuite" tests="2" failures="0" errors="0" skipped="0" time="0.5">
              <testcase name="testA" classname="com.example.CommitTest" time="0.2"/>
              <testcase name="testB" classname="com.example.CommitTest" time="0.3"/>
            </testsuite>
          </testsuites>
          EOF

      - name: Get current commit SHA
        id: get-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          report_paths: '**/junit-reports/TEST-commit.xml'
          commit: ${{ steps.get-sha.outputs.sha }}
          annotate_only: 'true'
          fail_on_failure: 'false'

      - name: Assert action ran with commit input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total }}
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total: $TOTAL"
          echo "passed: $PASSED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL" ]; then
              echo "FAIL: action succeeded but total output is empty"
              exit 1
            fi
            echo "PASS: total=$TOTAL passed=$PASSED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
