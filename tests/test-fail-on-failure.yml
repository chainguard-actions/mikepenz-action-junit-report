name: Test fail_on_failure flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          report_paths: '${{ github.workspace }}/tests/fixtures/junit-fail/TEST-*.xml'
          annotate_only: 'true'
          fail_on_failure: 'true'
          check_name: 'Fail On Failure Report'
          job_summary: 'false'
          skip_annotations: 'true'

      - name: Assert action failed due to test failures
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed: $FAILED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fail_on_failure=true and tests fail, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed due to test failures"
