name: Test fail_on_failure flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML report with a failure
        run: |
          mkdir -p /tmp/junit-reports
          cat > /tmp/junit-reports/TEST-fail.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="FailSuite" tests="2" failures="1" errors="0" skipped="0" time="1.000">
            <testcase name="testPass" classname="com.example.TestClass" time="0.500"/>
            <testcase name="testFail" classname="com.example.TestClass" time="0.500">
              <failure message="Test failed" type="AssertionError">
                Expected: 1
                Actual: 2
              </failure>
            </testcase>
          </testsuite>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          report_paths: '/tmp/junit-reports/TEST-*.xml'
          annotate_only: 'true'
          fail_on_failure: 'true'
          check_name: 'Fail On Failure Test Report'
          job_summary: 'false'

      - name: Assert action failed due to test failures
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed: $FAILED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fail_on_failure=true and tests failed, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when fail_on_failure=true"
