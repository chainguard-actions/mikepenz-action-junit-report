name: Test fail_on_failure fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          report_paths: 'tests/fixtures/mixed/*.xml'
          annotate_only: 'true'
          fail_on_failure: 'true'
      - name: Assert step failed with outputs set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "outcome=$OUTCOME failed=$FAILED"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure outcome"; exit 1; }
          [ "$FAILED" = "1" ] || { echo "FAIL: failed expected 1"; exit 1; }
          echo "PASS"
