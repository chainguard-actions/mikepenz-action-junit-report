name: Test fail_on_failure causes step failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML report with a failing test
        run: |
          mkdir -p /tmp/junit-reports
          cat > /tmp/junit-reports/TEST-fail.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="AllTests" tests="2" failures="1" errors="0" time="1.000">
            <testsuite name="com.example.FailTest" tests="2" failures="1" errors="0" time="1.000">
              <testcase name="testPass" classname="com.example.FailTest" time="0.500"/>
              <testcase name="testFail" classname="com.example.FailTest" time="0.500">
                <failure message="Expected 1 but was 2" type="AssertionError">
                  AssertionError: Expected 1 but was 2
                    at com.example.FailTest.testFail(FailTest.java:30)
                </failure>
              </testcase>
            </testsuite>
          </testsuites>
          EOF

      - id: junit
        uses: .
        with:
          report_paths: '/tmp/junit-reports/TEST-*.xml'
          check_name: 'Fail On Failure Test Report'
          fail_on_failure: 'true'
          annotate_only: 'true'
          job_summary: 'false'
        continue-on-error: true

      - name: Assert step failed due to test failures
        env:
          OUTCOME: ${{ steps.junit.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step outcome=failure when fail_on_failure=true and tests fail, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: step correctly failed due to test failures"

      - name: Assert failed count is non-zero
        env:
          ACTUAL: ${{ steps.junit.outputs.failed }}
        run: |
          echo "failed: $ACTUAL"
          if [ "$ACTUAL" = "0" ] || [ -z "$ACTUAL" ]; then
            echo "FAIL: expected failed > 0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
