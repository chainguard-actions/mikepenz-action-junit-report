name: Test basic passing JUnit report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report_paths: '${{ github.workspace }}/tests/fixtures/junit-passing/TEST-*.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
          check_name: 'Basic Passing Test Report'
          job_summary: 'false'
          skip_annotations: 'true'

      - name: Assert total count
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "3" ]; then
            echo "FAIL: expected total=3, got '$TOTAL'"
            exit 1
          fi
          echo "PASS: total=3"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected passed=3, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed=3"

      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected failed=0, got '$FAILED'"
            exit 1
          fi
          echo "PASS: failed=0"

      - name: Assert skipped count
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "0" ]; then
            echo "FAIL: expected skipped=0, got '$SKIPPED'"
            exit 1
          fi
          echo "PASS: skipped=0"

      - name: Assert summary is non-empty
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary: $SUMMARY"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected non-empty summary"
            exit 1
          fi
          echo "PASS: summary is non-empty"
