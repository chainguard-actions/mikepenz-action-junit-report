name: Test basic passing JUnit report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create passing JUnit XML report
        run: |
          mkdir -p /tmp/junit-reports
          cat > /tmp/junit-reports/TEST-passing.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="PassingSuite" tests="3" failures="0" errors="0" skipped="0" time="1.234">
            <testcase name="testOne" classname="com.example.TestClass" time="0.400"/>
            <testcase name="testTwo" classname="com.example.TestClass" time="0.500"/>
            <testcase name="testThree" classname="com.example.TestClass" time="0.334"/>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          report_paths: '/tmp/junit-reports/TEST-*.xml'
          annotate_only: 'true'
          fail_on_failure: 'false'
          check_name: 'Basic Passing Test Report'
          job_summary: 'true'

      - name: Assert total count
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "3" ]; then
            echo "FAIL: expected total=3, got '$TOTAL'"
            exit 1
          fi
          echo "PASS: total=3"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected passed=3, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed=3"

      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected failed=0, got '$FAILED'"
            exit 1
          fi
          echo "PASS: failed=0"

      - name: Assert skipped count
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "0" ]; then
            echo "FAIL: expected skipped=0, got '$SKIPPED'"
            exit 1
          fi
          echo "PASS: skipped=0"

      - name: Assert time is non-empty
        env:
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: expected non-empty time output"
            exit 1
          fi
          echo "PASS: time is non-empty"
