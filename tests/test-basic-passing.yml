name: Test basic passing JUnit report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML report with passing tests
        run: |
          mkdir -p /tmp/junit-reports
          cat > /tmp/junit-reports/TEST-passing.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="AllTests" tests="3" failures="0" errors="0" time="1.234">
            <testsuite name="com.example.PassingTests" tests="3" failures="0" errors="0" time="1.234">
              <testcase name="testOne" classname="com.example.PassingTests" time="0.400"/>
              <testcase name="testTwo" classname="com.example.PassingTests" time="0.400"/>
              <testcase name="testThree" classname="com.example.PassingTests" time="0.434"/>
            </testsuite>
          </testsuites>
          EOF

      - id: junit
        uses: .
        with:
          report_paths: '/tmp/junit-reports/TEST-*.xml'
          check_name: 'Basic Passing Test Report'
          fail_on_failure: 'false'
          annotate_only: 'true'
          job_summary: 'true'

      - name: Assert total count
        env:
          ACTUAL: ${{ steps.junit.outputs.total }}
        run: |
          echo "total: $ACTUAL"
          if [ "$ACTUAL" != "3" ]; then
            echo "FAIL: expected total=3, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert passed count
        env:
          ACTUAL: ${{ steps.junit.outputs.passed }}
        run: |
          echo "passed: $ACTUAL"
          if [ "$ACTUAL" != "3" ]; then
            echo "FAIL: expected passed=3, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert failed count
        env:
          ACTUAL: ${{ steps.junit.outputs.failed }}
        run: |
          echo "failed: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected failed=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
