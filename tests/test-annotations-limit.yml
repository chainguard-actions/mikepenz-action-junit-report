name: Test annotations_limit and exclude_sources inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML report with multiple tests
        run: |
          mkdir -p junit-reports
          cat > junit-reports/TEST-sample.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="SampleSuite" tests="3" failures="0" errors="0" skipped="0" time="1.0">
              <testcase name="test1" classname="com.example.Test" time="0.3"/>
              <testcase name="test2" classname="com.example.Test" time="0.3"/>
              <testcase name="test3" classname="com.example.Test" time="0.4"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          report_paths: '**/junit-reports/TEST-*.xml'
          annotations_limit: '5'
          exclude_sources: 'src/generated,build'
          annotate_only: 'true'
          fail_on_failure: 'false'

      - name: Assert action ran and produced outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total }}
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total: $TOTAL"
          echo "passed: $PASSED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL" ]; then
              echo "FAIL: action succeeded but total output is empty"
              exit 1
            fi
            echo "PASS: total=$TOTAL passed=$PASSED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
