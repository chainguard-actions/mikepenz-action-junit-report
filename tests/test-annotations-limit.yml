name: Test annotations_limit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          report_paths: 'tests/fixtures/mixed/TEST-*.xml'
          annotate_only: 'true'
          annotations_limit: '1'
      - name: Assert action ran and produced counts
        env:
          TOTAL: ${{ steps.action.outputs.total }}
          FAILED: ${{ steps.action.outputs.failed }}
          SUMMARY: ${{ steps.action.outputs.summary }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome=$OUTCOME total=$TOTAL failed=$FAILED"
          [ "$OUTCOME" = "success" ] || { echo "FAIL: outcome should be success"; exit 1; }
          case "$TOTAL" in ''|*[!0-9]*) echo "FAIL: total not numeric"; exit 1 ;; esac
          [ "$TOTAL" -ge 1 ] || { echo "FAIL: total expected >= 1"; exit 1; }
          [ "$TOTAL" -le 4 ] || { echo "FAIL: total expected <= 4"; exit 1; }
          [ -n "$SUMMARY" ] || { echo "FAIL: summary empty"; exit 1; }
          echo "PASS"
